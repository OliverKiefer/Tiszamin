<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validátor</title>
    <link rel="stylesheet" href="../CSS/bejelntkezes.css">
</head>
<body>
    <body>
        <div class="form-card">
            <div class="form-header">
                <div class="profile-section">
                
                    <div class="profile-text">
                        <h1>Fiók Létrehozása</h1>
                        <span>Létrehozó Portál</span>
                        <a href="fooldal.html" class="vissza">Vissza a Főoldalra</a>
                    </div>
                </div>
                
            </div>
    
            <div class="form-body">
                <div class="input-group">
                    <label for="tajszam">Születési hely</label>
                    <input type="text" id="szulHely" placeholder="Baja">
                </div>

                <div class="input-group">
                    <label for="tajszam">Születési Idő</label>
                    <input type="text" id="szulIdo" placeholder="2008.12.23">
                </div>
    
                <div class="input-group">
                    <label for="szemelyiIg">Jelszó</label>
                    <input type="text" id="jelszoLetrehozas" placeholder="KiskutyaFüle1234">
                </div>
    
                <div class="input-group">
                    <label for="nev">Teljes név</label>
                    <input type="text" id="nev" placeholder="Balassi Bálint">
                </div>
    
                <button class="btn btn-main" onclick="ellenorzes()">Fiók Létrehozása</button>
    
                <div class="divider"><span>VAGY</span></div>
    
                <h1>Bejelentkezés</h1>
                <div class="input-group">
                    <label for="email">Email cím</label>
                    <input type="text" id="email" placeholder="szocsgabor@turr.hu">
                </div>

                <div class="input-group">
                    <label for="email">Jelszó</label>
                    <input type="text" id="jelszoBejelentkezes" placeholder="KiskutyaFüle1234">
                </div>
    
                <button class="btn btn-outline" onclick="ellenorzesEmail()">Bejelentkezés</button>
            </div>
            
        </div>
        <script src="../JS/letrehozas.js"></script>
        <script src="../JS/bejelentkezes.js"></script>
    </body>
</html>
